# @stelsel windows-workflow
#   soort: bevel
#   wanneer: push na main of bou/windows-installeerder, tag v*, of met die hand (Actions → Windows → Run workflow)
#   groep: installer | Installeerder
#   skryf: artefak Setup (Setup.exe + inhoud.txt)
#   doel: bou die Windows-app, sit vasgepende yt-dlp/ffmpeg/ffprobe/whisper-cli (SHA-256) en die VC++-looptyd by, maak Setup.exe met Inno Setup, en rook-toets dit: stil installeer, app begin, opgradeer oor die lopende app, deïnstalleer met die werkgids behou
#   status: bou
# Plan: planne/windows-installeerder.md
name: Windows

on:
  push:
    branches: [main, bou/windows-installeerder]
    tags: ["v*"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.9
  YTDLP_VERSION: 2026.10.26
  YTDLP_SHA256: f5389d3698ecde4ef06f4e6b1ce0294fe9ac1396228c8990b8d3416d6d177a7d
  QJS_VERSION: v0.18.0
  QJS_SHA256: ff03398d74ea6e6bd3a8e58058f7003225abcac229d7d57775b7aaae812a49c7
  FFMPEG_VERSION: 9.0.2
  FFMPEG_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba
  # whisper.cpp (local transcription when a video has no YouTube captions): the 9 MB CPU build goes into Setup.exe.
  # The CUDA build (whisper-bin-win-cuda-12.4.0-x64.zip, 735 MB, SHA-256 34f872ce724ca1ff0a4afca481853e5ee74250f8cb22153e499f953562846039)
  # is too big to bundle and unproven on the church PC's driver (needs >= 551); see navorsing/2026-11-22-whisper-cpp-afrikaans.md.
  WHISPER_VERSION: b5907
  WHISPER_SHA256: ecca07b277d943e9b9f4712856a144b857271a6b333104e511e1988e80db582b

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bou die app
        run: |
          flutter pub get
          flutter build windows --release

      - name: Laai yt-dlp en ffmpeg af (checksum)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-Pinned($url, $out, $sha) {
            Invoke-WebRequest $url -OutFile $out
            $got = (Get-FileHash $out -Algorithm SHA256).Hash
            if ($got -ne $sha) { throw "$out SHA-256 $got, verwag $sha" }
          }
          New-Item -ItemType Directory -Force deps | Out-Null
          Get-Pinned "https://github.com/yt-dlp/yt-dlp/releases/download/$env:YTDLP_VERSION/yt-dlp.exe" deps/yt-dlp.exe $env:YTDLP_SHA256
          # yt-dlp needs a JS runtime for YouTube (no node/deno on a clean Windows); QuickJS-ng is 1.9 MB.
          Get-Pinned "https://github.com/quickjs-ng/quickjs/releases/download/$env:QJS_VERSION/qjs-windows-x86_64.exe" deps/qjs.exe $env:QJS_SHA256
          Get-Pinned "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/ffmpeg-$env:FFMPEG_VERSION-essentials_build.zip" ffmpeg.zip $env:FFMPEG_SHA256
          Get-Pinned "https://github.com/ggml-org/whisper.cpp/releases/download/$env:WHISPER_VERSION/whisper-bin-x64.zip" whisper.zip $env:WHISPER_SHA256
          Expand-Archive whisper.zip -DestinationPath whisper
          New-Item -ItemType Directory -Force deps/whisper | Out-Null
          Copy-Item whisper/Release/whisper-cli.exe, whisper/Release/whisper.dll, whisper/Release/ggml*.dll deps/whisper/
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          Copy-Item ffmpeg/*/bin/ffmpeg.exe, ffmpeg/*/bin/ffprobe.exe deps/
          # App-local VC++ runtime: a clean Windows 11 often lacks it, and the redist would need admin.
          Copy-Item C:/Windows/System32/msvcp140.dll, C:/Windows/System32/vcruntime140.dll, C:/Windows/System32/vcruntime140_1.dll build/windows/x64/runner/Release/

      - name: Maak Setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" installer/setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rook-toets (installeer, begin, opgradeer, deïnstalleer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = "$env:LOCALAPPDATA\Preekverwerker"
          $data = "$env:APPDATA\za.co.gkoranjerivier\preekverwerker"
          # Ollama's 1.9 GB download is skipped on CI; everything else is the real silent install.
          $setupArgs = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /MERGETASKS="!ollama,!desktopicon" /LOG="setup.log"'
          function Install-Setup {
            $p = Start-Process installer/Output/Setup.exe -ArgumentList $setupArgs -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content setup.log -Tail 40; throw "Setup exit $($p.ExitCode)" }
          }

          Install-Setup
          $need = 'preekverwerker.exe', 'flutter_windows.dll', 'libmpv-2.dll', 'desktop_drop_plugin.dll',
            'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'yt-dlp.exe', 'qjs.exe', 'ffmpeg.exe', 'ffprobe.exe',
            'whisper-cli.exe', 'whisper.dll', 'ggml.dll',
            'data\app.so', 'unins000.exe'
          $missing = $need | Where-Object { -not (Test-Path (Join-Path $app $_)) }
          Get-ChildItem $app -Recurse -File | Where-Object FullName -notlike '*flutter_assets*' |
            ForEach-Object { '{0,12}  {1}' -f $_.Length, $_.FullName.Substring($app.Length + 1) } |
            Tee-Object -FilePath installer/Output/inhoud.txt
          if ($missing) { throw "Ontbreek in die installasie: $($missing -join ', ')" }
          & "$app\yt-dlp.exe" --version
          & "$app\ffprobe.exe" -version | Select-Object -First 1
          # whisper-cli must start (a missing DLL makes it exit at once without output).
          & "$app\whisper-cli.exe" --help *> whisper-help.txt
          if (-not (Select-String -Path whisper-help.txt -Pattern 'usage' -Quiet)) { Get-Content whisper-help.txt -Tail 20; throw 'whisper-cli --help het misluk' }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Preekverwerker\Preekverwerker.lnk")) { throw 'Geen Start-kieslys-ikoon nie' }

          # The app must start and stay up (missing DLLs or a startup exception end it at once).
          $proc = Start-Process "$app\preekverwerker.exe" -PassThru
          Start-Sleep 20
          if ($proc.HasExited) { throw "App het binne 20 s gestop (exit $($proc.ExitCode))" }
          "App loop ná 20 s (pid $($proc.Id))"

          # Upgrade over the running app: Restart Manager must close it; settings stay.
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content "$data\merker.txt" 'bly'
          Install-Setup
          Start-Sleep 2
          if (-not $proc.HasExited) { throw 'Opgradering het die lopende app nie toegemaak nie' }
          if (-not (Test-Path "$data\merker.txt")) { throw 'Opgradering het die werkgids verwyder' }
          'Opgradering oor die lopende app: OK'

          # Silent uninstall: program files go, the work folder stays.
          Start-Process "$app\preekverwerker.exe"
          Start-Sleep 5
          $u = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Deïnstalleer exit $($u.ExitCode)" }
          # unins000.exe hands over to a copy in %TEMP%; wait for it to finish removing files.
          for ($i = 0; $i -lt 30 -and (Test-Path "$app\preekverwerker.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\preekverwerker.exe") { throw 'Deïnstalleer het preekverwerker.exe gelos' }
          if (-not (Test-Path "$data\merker.txt")) { throw 'Deïnstalleer het die werkgids uitgevee' }
          'Deïnstalleer: OK (werkgids behou)'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Setup
          path: |
            installer/Output/Setup.exe
            installer/Output/inhoud.txt
          retention-days: 30
